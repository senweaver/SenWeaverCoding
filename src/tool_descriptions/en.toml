[tools]
shell = "Run a sandboxed shell command in the workspace and return stdout, stderr, and exit status. Use commands native to the host OS (see the Runtime section for the shell type); on Windows the shell is cmd.exe, so avoid Unix-only tools like grep/head/tail/wc/sed/awk and prefer the content_search/read_file tools or findstr/where/type/powershell."
