name = "mvn-build"
match_command = "^mvn\\b"
max_lines = 400
dedup = true

strip_lines = [
  "^\\[INFO\\] Downloading from",
  "^\\[INFO\\] Downloaded from",
  "^\\[INFO\\] -+$",
  "^\\[INFO\\] $",
  "^\\[INFO\\] Building ",
  "^\\[INFO\\] BUILD ",
  "^Progress \\(\\d+\\):",
]

[[replace]]
pattern = "\\[INFO\\] "
to = ""
