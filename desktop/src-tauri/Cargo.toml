[package]
name = "sen-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "sen_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "sen-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
senweavercoding = { path = "../..", package = "SenWeaverCoding", default-features = false, features = [
    "fs-watch",
    "sandbox",
    "sandbox-windows-job",
    "lsp-push-diagnostics",
    "observability-prometheus",
    "rag-pdf",
    "office-docs",
    "tool-cron",
    "tool-sop",
    "tool-team",
    "tool-cloud-ops",
    "tool-reports",
    "tool-linkedin",
    "tool-pushover",
    "tool-search-social",
    "tool-productivity",
    "tool-utility-misc",
    "tool-image",
    "tool-search-broad",
    "tool-workspace-deep",
    "tool-curator",
    "skill-creation",
    "code-intel",
    "channels-lite",
    "whatsapp-web",
    "lan-comms",
    "computer-use",
    "crdt-coordination",
] }

tauri = { version = "2.11", features = ["unstable", "image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

portable-pty = "0.8"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = { version = "0.2", default-features = false }
async-trait = "0.1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints.rust]
unused_must_use = "warn"
