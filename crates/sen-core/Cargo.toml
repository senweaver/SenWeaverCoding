[package]
name = "sen-core"
version = "0.1.0"
edition = "2024"

[dependencies]
senweavercoding = { path = "../..", package = "SenWeaverCoding", default-features = false }

[features]
default = []
code-intel = ["senweavercoding/code-intel"]
observability-prometheus = ["senweavercoding/observability-prometheus"]
observability-otel = ["senweavercoding/observability-otel"]
sandbox = ["senweavercoding/sandbox"]
# Non-core tool feature groups (opt-in, forwarded to root crate)
tool-cron = ["senweavercoding/tool-cron"]
tool-sop = ["senweavercoding/tool-sop"]
tool-team = ["senweavercoding/tool-team"]
tool-cloud-ops = ["senweavercoding/tool-cloud-ops"]
tool-reports = ["senweavercoding/tool-reports"]
tool-linkedin = ["senweavercoding/tool-linkedin"]
tool-pushover = ["senweavercoding/tool-pushover"]
tool-search-social = ["senweavercoding/tool-search-social"]
tool-productivity = ["senweavercoding/tool-productivity"]
tool-utility-misc = ["senweavercoding/tool-utility-misc"]
tool-image = ["senweavercoding/tool-image"]
# Convenience: all non-core tools
extras = ["senweavercoding/extras"]
