[package]
name = "sen-channels"
version = "0.1.0"
edition = "2024"

[dependencies]
senweavercoding = { path = "../..", package = "SenWeaverCoding", default-features = false }

[features]
default = []
# Channel implementations — each enables the corresponding channel feature in senweavercoding
telegram = ["senweavercoding/channel-telegram"]
discord = ["senweavercoding/channel-discord"]
slack = ["senweavercoding/channel-slack"]
matrix = ["senweavercoding/channel-matrix"]
lark = ["senweavercoding/channel-lark"]
nostr = ["senweavercoding/channel-nostr"]
email = ["senweavercoding/channel-email"]
whatsapp-web = ["senweavercoding/whatsapp-web"]
dingtalk = ["senweavercoding/channel-dingtalk"]
wechat = ["senweavercoding/channel-wechat"]
line = ["senweavercoding/channel-line"]
# Enable all channels
all = ["telegram", "discord", "slack", "matrix", "lark", "nostr", "email", "whatsapp-web", "dingtalk", "wechat", "line"]
