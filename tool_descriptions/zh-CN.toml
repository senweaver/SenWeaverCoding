# 工具描述 — 简体中文
#
# 本文件由 `src/i18n.rs::load_locale_file` 加载，为暴露给 LLM 的工具提供
# 面向用户的描述文本。键为工具名（与 `Tool::name()` 对应）；值为中文描述。

[tools]
shell = "执行 shell 命令并捕获 stdout/stderr 输出。"
file_read = "从磁盘读取文件内容。"
file_write = "向文件写入内容（若不存在则创建）。"
file_edit = "对文件应用精确字符串替换。"
glob_search = "使用 glob 模式在工作区查找文件。"
content_search = "在工作区中搜索包含指定文本的文件。"
memory_store = "将键值对持久化到代理的长期记忆中。"
memory_recall = "按键或语义搜索召回已存储的记忆。"
web_fetch = "抓取 URL 内容并返回纯文本。"
web_search = "执行 Web 搜索并返回摘要结果。"
todo_write = "管理代理的任务列表（计划、进行中、已完成）。"
delegate = "将子任务委派给指定的专家子代理。"
delegate_parallel = "将多个子任务并行分发执行。"
send_message = "在配置的通道上发送消息（Telegram、Slack 等）。"
enter_plan_mode = "进入仅规划模式：仅允许规划类工具。"
exit_plan_mode = "退出规划模式，恢复完整工具集。"
task_create = "在任务运行器中创建新的后台任务。"
task_get = "获取后台任务的状态和输出。"
task_list = "列出所有后台任务。"
task_stop = "停止正在运行的后台任务。"
lsp = "调用语言服务器协议请求（悬停、定义跳转等）。"
