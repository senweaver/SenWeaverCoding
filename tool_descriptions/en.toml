# Tool descriptions — English
#
# This file is loaded by `src/i18n.rs::load_locale_file` and provides
# human-facing descriptions for tools exposed to the LLM.  Keys are tool
# names (matching `Tool::name()`); values are the English description text.

[tools]
shell = "Execute a shell command and capture its stdout/stderr."
file_read = "Read the contents of a file from disk."
file_write = "Write content to a file, creating it if needed."
file_edit = "Apply an exact string replacement to a file."
glob_search = "Find files in the workspace matching a glob pattern."
content_search = "Search the workspace for files containing a text pattern."
memory_store = "Persist a key/value pair to the agent's long-term memory."
memory_recall = "Retrieve a previously stored memory by key or semantic search."
web_fetch = "Fetch a URL and return its contents as plain text."
web_search = "Perform a web search and return summarized results."
todo_write = "Manage the agent's task list (plan, in-progress, completed)."
delegate = "Delegate a subtask to a named specialist sub-agent."
delegate_parallel = "Fan out multiple sub-tasks to run in parallel."
send_message = "Send a message on a configured channel (Telegram, Slack, etc.)."
enter_plan_mode = "Enter plan-only mode: restrict tools to planning capability."
exit_plan_mode = "Exit plan mode and return to the full tool surface."
task_create = "Create a new background task in the task runner."
task_get = "Get the status and output of a background task."
task_list = "List all background tasks."
task_stop = "Stop a running background task."
lsp = "Invoke a Language Server Protocol request (hover, definition, etc.)."
