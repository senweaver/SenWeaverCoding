name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`).  Each platform job:
#   1. Performs a clean checkout (no local dev state can leak in).
#   2. Builds the `sen` CLI binary from the back-end at `src/`.
#   3. Drops it under `desktop/src-tauri/binaries/sen[.exe]` so the Tauri
#      bundler can include it in the installer (per-platform override
#      configs at desktop/src-tauri/tauri.<os>.conf.json).
#   4. Lets `tauri-action` build the front-end + desktop application and
#      attach every produced installer to a single GitHub Release.
#
# Resulting Release assets per tag:
#   * Windows:  *_x64-setup.exe (NSIS, picks install dir, adds to PATH),
#               *_x64_en-US.msi
#   * macOS:    *_universal.dmg (one universal binary that runs natively
#               on both Apple Silicon and Intel; `sen` is a fat binary at
#               .app/Contents/Resources/sen)
#   * Linux:    *_amd64.deb (installs both the desktop launcher and /usr/bin/sen),
#               *_amd64.AppImage (desktop app only — install the deb if you want CLI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Lift Node's old-space heap from the default ~2 GB so Vite/tsc can
  # finish bundling the desktop front-end on macOS arm64 runners
  # (which OOM on the default limit).
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  # ── Stage 1: create the GitHub Release shell first so every
  # platform job can attach its installers to the same release.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag_name: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: SenWeaverCoding ${{ steps.resolve.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true

  # ── Stage 2: build the desktop installer (and embed `sen` CLI)
  # on every supported platform.
  build:
    name: Build (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            toolchain_targets: x86_64-pc-windows-msvc
            cli_target: x86_64-pc-windows-msvc
            cli_src: target/x86_64-pc-windows-msvc/release/sen.exe
            cli_dst: desktop/src-tauri/binaries/sen.exe
            tauri_args: ""
          # One macOS job that produces a universal (arm64 + x86_64) build
          # on the abundant macos-14 (Apple Silicon) runner pool.  Avoids
          # the macos-13 Intel runner queue (often 30-90 min waits) that
          # used to gate the entire release.
          - label: macos-universal
            os: macos-14
            toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
            cli_target: ""
            cli_src: ""
            cli_dst: desktop/src-tauri/binaries/sen
            tauri_args: "--target universal-apple-darwin"
          - label: linux-x86_64
            # 24.04 ships PipeWire 1.x (libspa-0.2-dev that matches the
            # `libspa-0.9.2` Rust bindings transitively pulled in by
            # `xcap` -> `pipewire`).  22.04 ships an older PipeWire whose
            # C `spa_video_info_raw` struct is missing the `flags` /
            # `modifier` fields the bindgen-generated wrapper expects,
            # causing E0560 / E0609 / E0308 build errors.
            os: ubuntu-24.04
            toolchain_targets: x86_64-unknown-linux-gnu
            cli_target: x86_64-unknown-linux-gnu
            cli_src: target/x86_64-unknown-linux-gnu/release/sen
            cli_dst: desktop/src-tauri/binaries/sen
            tauri_args: ""

    steps:
      # Hard guarantee: clean checkout, no leftover state from cache layers.
      - name: Checkout (clean)
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.label }}-cargoreg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargoreg-

      - name: Install Linux desktop runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri WebView (webkit2gtk-4.1) + GTK 3 + AppIndicator + SVG + TLS
          # are the standard Tauri-on-Linux toolchain.
          # libpipewire-0.3-dev / libspa-0.2-dev satisfy the `xcap` ->
          # `pipewire` -> `libspa-sys` chain.
          # libgbm/libegl/libgl/libdrm/libwayland/libxkbcommon-dev satisfy
          # the `xcap` -> `libwayshot_xcap` Wayland screen-capture backend
          # which links against -lgbm / -lEGL / -lGL / -ldrm / -lwayland-client
          # / -lxkbcommon at final-link time.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libdrm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            patchelf \
            file \
            wget

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Inject the release tag (e.g. v0.1.1) into every version source so
      # the produced installers, package metadata and `sen --version`
      # output all align on the same X.Y.Z without a manual bump commit.
      # Touches: root Cargo.toml, desktop/package.json,
      #          desktop/src-tauri/tauri.conf.json,
      #          desktop/src-tauri/Cargo.toml.
      # Cargo.lock is intentionally left to `cargo build` to refresh.
      - name: Inject version from tag
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ needs.create-release.outputs.tag_name }}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$raw' is not semver vX.Y.Z" >&2
            exit 1
          fi
          echo "Injecting version=$version"
          python3 - "$version" <<'PY'
          import json, re, sys, pathlib
          version = sys.argv[1]

          p = pathlib.Path("desktop/src-tauri/tauri.conf.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          obj["version"] = version
          p.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          p = pathlib.Path("desktop/package.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          obj["version"] = version
          p.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          cargo_re = re.compile(r'^(version\s*=\s*)"[^"]*"', re.MULTILINE)
          for path in ("Cargo.toml", "desktop/src-tauri/Cargo.toml"):
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              new_text, n = cargo_re.subn(rf'\1"{version}"', text, count=1)
              if n != 1:
                  raise SystemExit(f"failed to patch [package].version in {path}")
              p.write_text(new_text, encoding="utf-8")
          PY
          echo "--- patched ---"
          grep -E '^version\s*=' Cargo.toml
          grep -E '^version\s*=' desktop/src-tauri/Cargo.toml
          python3 -c "import json; print('tauri:', json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])"
          python3 -c "import json; print('pkg:', json.load(open('desktop/package.json'))['version'])"

      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      # Build the `sen` CLI from the Rust workspace and inject it under
      # desktop/src-tauri/binaries/.  The per-platform Tauri config
      # overrides below are generated only on CI (they're gitignored)
      # so that local `bun run tauri dev` doesn't fail with
      # "resource path `binaries/sen[.exe]` doesn't exist" -- the
      # devloop never invokes `cargo build --bin sen`, so the binary
      # the override would reference simply isn't there in dev.
      - name: Build sen CLI (single arch)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release --target ${{ matrix.cli_target }} --bin sen
          mkdir -p "$(dirname "${{ matrix.cli_dst }}")"
          cp "${{ matrix.cli_src }}" "${{ matrix.cli_dst }}"
          ls -la "${{ matrix.cli_dst }}"

      # macOS produces a universal binary (arm64 + x86_64) via `lipo`,
      # so the single shipped `.dmg` runs natively on both Apple Silicon
      # and Intel Macs.  Output is written straight into the resource
      # path Tauri expects, so no `cp` is needed afterwards.
      - name: Build sen CLI (macOS universal via lipo)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release --target aarch64-apple-darwin --bin sen
          cargo build --release --target x86_64-apple-darwin  --bin sen
          mkdir -p "$(dirname "${{ matrix.cli_dst }}")"
          lipo -create \
            -output "${{ matrix.cli_dst }}" \
            target/aarch64-apple-darwin/release/sen \
            target/x86_64-apple-darwin/release/sen
          chmod +x "${{ matrix.cli_dst }}"
          file "${{ matrix.cli_dst }}"
          lipo -info "${{ matrix.cli_dst }}"

      - name: Emit Windows tauri override
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.windows.conf.json <<'JSON'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "resources": {
                "binaries/sen.exe": "sen.exe"
              }
            }
          }
          JSON

      - name: Emit macOS tauri override
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.macos.conf.json <<'JSON'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "resources": {
                "binaries/sen": "sen"
              }
            }
          }
          JSON

      - name: Emit Linux tauri override
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.linux.conf.json <<'JSON'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "linux": {
                "deb": {
                  "files": {
                    "/usr/bin/sen": "binaries/sen"
                  }
                }
              }
            }
          }
          JSON

      - name: Build & bundle desktop application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: desktop
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: SenWeaverCoding ${{ needs.create-release.outputs.tag_name }}
          args: ${{ matrix.tauri_args }}

  # ── Stage 3: publish the release once every platform succeeded.
  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: false
          prerelease: false
