name: Release

# Triggered by pushing a `v*` tag (e.g. `v0.1.0`).  Each platform job:
#   1. Performs a clean checkout (no local dev state can leak in).
#   2. Builds the `sen` CLI binary from the back-end at `src/`.
#   3. Drops it under `desktop/src-tauri/binaries/sen[.exe]` so the Tauri
#      bundler can include it in the installer (per-platform override
#      configs at desktop/src-tauri/tauri.<os>.conf.json).
#   4. Lets `tauri-action` build the front-end + desktop application and
#      attach every produced installer to a single GitHub Release.
#
# Resulting Release assets per tag:
#   * Windows:  *_x64-setup.exe (NSIS, picks install dir, adds to PATH),
#               *_x64_en-US.msi
#   * macOS:    *_universal.dmg (one universal binary that runs natively
#               on both Apple Silicon and Intel; `sen` is a fat binary at
#               .app/Contents/Resources/sen)
#   * Linux:    *_amd64.deb (installs both the desktop launcher and /usr/bin/sen),
#               *_amd64.AppImage (desktop app only — install the deb if you want CLI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Lift Node's old-space heap from the default ~2 GB so Vite/tsc can
  # finish bundling the desktop front-end on macOS arm64 runners
  # (which OOM on the default limit).
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  # ── Stage 1: create the GitHub Release shell first so every
  # platform job can attach its installers to the same release.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      tag_name: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: SenWeaverCoding ${{ steps.resolve.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true

  # ── Stage 2: build the desktop installer (and embed `sen` CLI)
  # on every supported platform.
  build:
    name: Build (${{ matrix.label }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            toolchain_targets: x86_64-pc-windows-msvc
            cli_target: x86_64-pc-windows-msvc
            cli_src: target/x86_64-pc-windows-msvc/release/sen.exe
            cli_dst: desktop/src-tauri/binaries/sen.exe
            tauri_args: ""
          # One macOS job that produces a universal (arm64 + x86_64) build
          # on the abundant macos-14 (Apple Silicon) runner pool.  Avoids
          # the macos-13 Intel runner queue (often 30-90 min waits) that
          # used to gate the entire release.
          - label: macos-universal
            os: macos-14
            toolchain_targets: aarch64-apple-darwin,x86_64-apple-darwin
            cli_target: ""
            cli_src: ""
            cli_dst: desktop/src-tauri/binaries/sen
            tauri_args: "--target universal-apple-darwin"
          - label: linux-x86_64
            # 24.04 ships PipeWire 1.x (libspa-0.2-dev that matches the
            # `libspa-0.9.2` Rust bindings transitively pulled in by
            # `xcap` -> `pipewire`).  22.04 ships an older PipeWire whose
            # C `spa_video_info_raw` struct is missing the `flags` /
            # `modifier` fields the bindgen-generated wrapper expects,
            # causing E0560 / E0609 / E0308 build errors.
            os: ubuntu-24.04
            toolchain_targets: x86_64-unknown-linux-gnu
            cli_target: x86_64-unknown-linux-gnu
            cli_src: target/x86_64-unknown-linux-gnu/release/sen
            cli_dst: desktop/src-tauri/binaries/sen
            tauri_args: ""

    steps:
      # Hard guarantee: clean checkout, no leftover state from cache layers.
      - name: Checkout (clean)
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: false
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.label }}-cargoreg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargoreg-

      - name: Install Linux desktop runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri WebView (webkit2gtk-4.1) + GTK 3 + AppIndicator + SVG + TLS
          # are the standard Tauri-on-Linux toolchain.
          # libpipewire-0.3-dev / libspa-0.2-dev satisfy the `xcap` ->
          # `pipewire` -> `libspa-sys` chain.
          # libgbm/libegl/libgl/libdrm/libwayland/libxkbcommon-dev satisfy
          # the `xcap` -> `libwayshot_xcap` Wayland screen-capture backend
          # which links against -lgbm / -lEGL / -lGL / -ldrm / -lwayland-client
          # / -lxkbcommon at final-link time.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libdrm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            patchelf \
            file \
            wget

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Inject the release tag (e.g. v0.1.1) into every version source so
      # the produced installers, package metadata and `sen --version`
      # output all align on the same X.Y.Z without a manual bump commit.
      # Touches: root Cargo.toml, desktop/package.json,
      #          desktop/src-tauri/tauri.conf.json,
      #          desktop/src-tauri/Cargo.toml.
      # Cargo.lock is intentionally left to `cargo build` to refresh.
      - name: Inject version from tag
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ needs.create-release.outputs.tag_name }}"
          version="${raw#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$raw' is not semver vX.Y.Z" >&2
            exit 1
          fi
          echo "Injecting version=$version"
          python3 - "$version" <<'PY'
          import json, re, sys, pathlib
          version = sys.argv[1]

          p = pathlib.Path("desktop/src-tauri/tauri.conf.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          obj["version"] = version
          p.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          p = pathlib.Path("desktop/package.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          obj["version"] = version
          p.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          cargo_re = re.compile(r'^(version\s*=\s*)"[^"]*"', re.MULTILINE)
          for path in ("Cargo.toml", "desktop/src-tauri/Cargo.toml"):
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              new_text, n = cargo_re.subn(rf'\1"{version}"', text, count=1)
              if n != 1:
                  raise SystemExit(f"failed to patch [package].version in {path}")
              p.write_text(new_text, encoding="utf-8")
          PY
          echo "--- patched ---"
          grep -E '^version\s*=' Cargo.toml
          grep -E '^version\s*=' desktop/src-tauri/Cargo.toml
          python3 -c "import json; print('tauri:', json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])"
          python3 -c "import json; print('pkg:', json.load(open('desktop/package.json'))['version'])"

      - name: Install frontend dependencies
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max=5
          delay=20
          while true; do
            if bun install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::bun install failed after ${max} attempts" >&2
              exit 1
            fi
            echo "bun install attempt ${attempt} failed; clearing cache and retrying in ${delay}s..." >&2
            bun pm cache rm || true
            rm -rf node_modules || true
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay + 15))
          done

      - name: Prefetch cargo dependencies
        shell: bash
        run: |
          set -euo pipefail
          cargo_retry() {
            local attempt=1
            local max=5
            local delay=20
            while true; do
              if cargo "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::cargo failed after ${max} attempts: cargo $*" >&2
                return 1
              fi
              echo "cargo attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 15))
            done
          }
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo_retry fetch --locked --target aarch64-apple-darwin --bin sen --no-default-features --features channels-lite
            cargo_retry fetch --locked --target x86_64-apple-darwin --bin sen --no-default-features --features channels-lite
          elif [ -n "${{ matrix.cli_target }}" ]; then
            cargo_retry fetch --locked --target ${{ matrix.cli_target }} --bin sen --no-default-features --features channels-lite
          fi
          cargo_retry fetch --locked -p sen-desktop

      - name: Verify feature gates (lib + desktop)
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          cargo_retry() {
            local attempt=1
            local max=5
            local delay=20
            while true; do
              if cargo "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::cargo failed after ${max} attempts: cargo $*" >&2
                return 1
              fi
              echo "cargo attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 15))
            done
          }
          cargo_retry check --lib --no-default-features
          cargo_retry check -p sen-desktop

      # Build the `sen` CLI from the Rust workspace and inject it under
      # desktop/src-tauri/binaries/.  The per-platform Tauri config
      # overrides below are generated only on CI (they're gitignored)
      # so that local `bun run tauri dev` doesn't fail with
      # "resource path `binaries/sen[.exe]` doesn't exist" -- the
      # devloop never invokes `cargo build --bin sen`, so the binary
      # the override would reference simply isn't there in dev.
      - name: Build sen CLI (single arch)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo_retry() {
            local attempt=1
            local max=5
            local delay=20
            while true; do
              if cargo "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::cargo failed after ${max} attempts: cargo $*" >&2
                return 1
              fi
              echo "cargo attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 15))
            done
          }
          set -x
          cargo_retry build --release --target ${{ matrix.cli_target }} --bin sen --no-default-features --features channels-lite
          mkdir -p "$(dirname "${{ matrix.cli_dst }}")"
          cp "${{ matrix.cli_src }}" "${{ matrix.cli_dst }}"
          ls -la "${{ matrix.cli_dst }}"

      # macOS produces a universal binary (arm64 + x86_64) via `lipo`,
      # so the single shipped `.dmg` runs natively on both Apple Silicon
      # and Intel Macs.  Output is written straight into the resource
      # path Tauri expects, so no `cp` is needed afterwards.
      - name: Build sen CLI (macOS universal via lipo)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo_retry() {
            local attempt=1
            local max=5
            local delay=20
            while true; do
              if cargo "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::cargo failed after ${max} attempts: cargo $*" >&2
                return 1
              fi
              echo "cargo attempt ${attempt} failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay + 15))
            done
          }
          set -x
          cargo_retry build --release --target aarch64-apple-darwin --bin sen --no-default-features --features channels-lite
          cargo_retry build --release --target x86_64-apple-darwin  --bin sen --no-default-features --features channels-lite
          mkdir -p "$(dirname "${{ matrix.cli_dst }}")"
          lipo -create \
            -output "${{ matrix.cli_dst }}" \
            target/aarch64-apple-darwin/release/sen \
            target/x86_64-apple-darwin/release/sen
          chmod +x "${{ matrix.cli_dst }}"
          file "${{ matrix.cli_dst }}"
          lipo -info "${{ matrix.cli_dst }}"

      - name: Emit Windows tauri override
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.windows.conf.json <<'JSON'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "resources": {
                "binaries/sen.exe": "sen.exe"
              }
            }
          }
          JSON

      - name: Emit macOS tauri override
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.macos.conf.json <<'JSON'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "resources": {
                "binaries/sen": "sen"
              }
            }
          }
          JSON

      - name: Emit Linux tauri override
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.linux.conf.json <<'JSON'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "bundle": {
              "linux": {
                "deb": {
                  "files": {
                    "/usr/bin/sen": "binaries/sen"
                  }
                }
              }
            }
          }
          JSON

      - name: Build & bundle desktop application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri's official updater requires every produced bundle to be
          # signed with the project's minisign-format private key.  CI has
          # the key in repo secret TAURI_SIGNING_PRIVATE_KEY (and the
          # matching password in TAURI_SIGNING_PRIVATE_KEY_PASSWORD).  When
          # `bundle.createUpdaterArtifacts: true` in tauri.conf.json is on,
          # tauri-action emits both the installer and a `.sig` next to it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          projectPath: desktop
          tagName: ${{ needs.create-release.outputs.tag_name }}
          releaseName: SenWeaverCoding ${{ needs.create-release.outputs.tag_name }}
          args: ${{ matrix.tauri_args }}

  # ── Stage 3: aggregate per-platform signed installers into a
  # single `latest.json` manifest the in-app updater fetches at
  # `https://github.com/.../releases/latest/download/latest.json`.
  publish-updater-manifest:
    name: Publish updater manifest
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # Download every `*.sig` produced by the build matrix.  `gh release
      # download` is the only stable way to read assets while the release is
      # still in `draft: true` — `GET /releases/tags/{tag}` returns 404 for
      # drafts and the public `github.com/.../releases/download/...` URL
      # 404s as well.  `gh` uses the authenticated REST API and follows
      # asset redirects without leaking the bearer token to S3.
      - name: Download signature assets from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sigs
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "*.sig" \
            --dir sigs \
            --clobber
          echo "--- downloaded sigs ---"
          ls -la sigs

      - name: Build latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys, datetime, pathlib, urllib.request

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          release_id = os.environ["RELEASE_ID"]
          version = tag[1:] if tag.startswith("v") else tag

          def gh_get_json(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "sen-release-publisher",
              })
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Look the release up by id — drafts are invisible to /releases/tags/<tag>.
          release = gh_get_json(f"https://api.github.com/repos/{repo}/releases/{release_id}")
          notes = release.get("body") or ""
          assets = {a["name"]: a for a in release.get("assets", [])}
          # Public download URL.  Only resolves once `publish-release` flips
          # the release out of draft; the updater client only ever fetches
          # latest.json after that flip, so it's safe to embed now.
          dl_base = f"https://github.com/{repo}/releases/download/{tag}"
          sig_dir = pathlib.Path("sigs")

          def find(pattern):
              rx = re.compile(pattern)
              for name in assets:
                  if rx.search(name):
                      return name
              return None

          def read_sig(asset_name):
              sig_name = f"{asset_name}.sig"
              p = sig_dir / sig_name
              if not p.exists():
                  raise SystemExit(f"::error::sig not downloaded: {sig_name}")
              return p.read_text(encoding="utf-8").strip()

          # Tauri v2 update payload conventions per platform:
          #   - Windows: NSIS `.exe` (file pattern `_x64-setup.exe`)
          #   - macOS:   `.app.tar.gz` (universal bundle)
          #   - Linux:   `.AppImage`  (file pattern `_amd64.AppImage`)
          targets = {
              "windows-x86_64": find(r"_x64-setup\.exe$"),
              "darwin-universal": find(r"\.app\.tar\.gz$"),
              "linux-x86_64": find(r"_amd64\.AppImage$"),
          }
          targets["darwin-x86_64"] = targets["darwin-universal"]
          targets["darwin-aarch64"] = targets["darwin-universal"]

          missing = [k for k, v in targets.items() if v is None or f"{v}.sig" not in assets]
          if missing:
              print(f"::error::missing signed bundle for platforms: {missing}", file=sys.stderr)
              print("available assets:", file=sys.stderr)
              for n in sorted(assets):
                  print(f"  - {n}", file=sys.stderr)
              sys.exit(1)

          platforms = {}
          for key, bundle in targets.items():
              platforms[key] = {
                  "signature": read_sig(bundle),
                  "url": f"{dl_base}/{bundle}",
              }

          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
          ls -la latest.json

      - name: Upload latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: latest.json
          draft: true
          prerelease: false

  # ── Stage 4: publish the release once every platform succeeded
  # AND the updater manifest is attached.
  publish-release:
    name: Publish release
    needs: [create-release, build, publish-updater-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          draft: false
          prerelease: false
