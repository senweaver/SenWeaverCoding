<!-- SenWeaverCoding built-in template -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[REPLACE] Page title · brand</title>
  <style>
    :root {
      --od-accent: #c96442;
      --od-scale: 1;
      --od-density: 1;
      --od-motion: 1;

      --bg:      #fafaf7;
      --surface: #ffffff;
      --fg:      #1a1916;
      --muted:   #6b6964;
      --border:  #e8e5df;
      --accent:  var(--od-accent);

      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft:     color-mix(in oklch, var(--fg) 6%, transparent);

      --font-display: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono:    ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace;

      --fs-h1: clamp(calc(44px * var(--od-scale)), 6vw, calc(76px * var(--od-scale)));
      --fs-h2: clamp(calc(32px * var(--od-scale)), 4vw, calc(48px * var(--od-scale)));
      --fs-h3: calc(22px * var(--od-scale));
      --fs-lead: calc(19px * var(--od-scale));
      --fs-body: calc(16px * var(--od-scale));
      --fs-meta: calc(13px * var(--od-scale));
      --fs-12: calc(12px * var(--od-scale));

      --gap-xs: calc(8px * var(--od-density));
      --gap-sm: calc(12px * var(--od-density));
      --gap-md: calc(20px * var(--od-density));
      --gap-lg: calc(32px * var(--od-density));
      --gap-xl: calc(56px * var(--od-density));
      --gap-2xl: calc(96px * var(--od-density));
      --container: 1120px;
      --gutter: calc(32px * var(--od-density));

      --dur-press: calc(0.05s * var(--od-motion));
      --dur-fast: calc(0.15s * var(--od-motion));

      --radius: 10px;
      --radius-lg: 16px;
    }

    html[data-od-mode="dark"] {
      --bg: #151412;
      --surface: #1f1d1a;
      --fg: #ece9e2;
      --muted: #98948b;
      --border: #2e2b26;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    .container {
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .section {
      padding-block: clamp(calc(48px * var(--od-density)), 8vw, var(--gap-2xl));
    }
    .section + .section { border-top: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }
    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
    }

    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }
    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: var(--fs-12);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--gap-md);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .topnav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in oklch, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: calc(14px * var(--od-density)); }
    .topnav .logo { font-family: var(--font-display); font-size: calc(19px * var(--od-scale)); font-weight: 600; letter-spacing: -0.01em; }
    .topnav nav { display: flex; gap: var(--gap-lg); }
    .topnav nav a { font-size: calc(14px * var(--od-scale)); color: var(--muted); transition: color var(--dur-fast) ease; }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: var(--fs-meta); border-top: 1px solid var(--border); }
    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: calc(11px * var(--od-density)) calc(20px * var(--od-density));
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: calc(15px * var(--od-scale));
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: transform var(--dur-press) ease, background var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }
    .btn-ghost:hover { color: var(--accent); }
    .btn-arrow::after { content: '→'; transition: transform var(--dur-fast) ease; }
    .btn-arrow:hover::after { transform: translateX(2px); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: calc(28px * var(--od-density));
    }
    .card-flat { background: transparent; border: 0; padding: 0; }
    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: calc(24px * var(--od-density)) 0 0; border-radius: 0; }

    .feature .feature-mark {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      margin-bottom: var(--gap-md);
    }
    .feature .feature-mark svg { width: 18px; height: 18px; }
    .feature h3 { margin-bottom: 6px; }
    .feature p  { margin: 0; color: var(--muted); font-size: calc(15px * var(--od-scale)); }

    .stat .stat-num {
      font-family: var(--font-display);
      font-size: clamp(calc(56px * var(--od-scale)), 8vw, calc(96px * var(--od-scale)));
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--accent);
      font-weight: 600;
    }
    .stat .stat-label { color: var(--muted); font-size: calc(14px * var(--od-scale)); margin-top: 8px; max-width: 24ch; }
    .stat .stat-unit  { font-size: 0.5em; opacity: 0.7; margin-left: 2px; }

    .quote {
      font-family: var(--font-display);
      font-size: clamp(calc(24px * var(--od-scale)), 2.6vw, calc(32px * var(--od-scale)));
      line-height: 1.32;
      letter-spacing: -0.01em;
      max-width: 28ch;
    }
    .quote-author { color: var(--muted); font-size: calc(14px * var(--od-scale)); margin-top: var(--gap-md); }
    .quote-mark   {
      font-family: var(--font-display);
      font-size: calc(140px * var(--od-scale)); line-height: 0.7;
      color: var(--accent); opacity: 0.18;
      margin-bottom: -28px;
    }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: calc(11px * var(--od-scale));
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tag {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: var(--fs-12);
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: var(--fs-meta); color: var(--muted); }
    .input, .textarea {
      width: 100%;
      padding: calc(11px * var(--od-density)) calc(14px * var(--od-density));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: calc(15px * var(--od-scale));
    }
    .input:focus, .textarea:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }

    .ds-table { width: 100%; border-collapse: collapse; font-size: calc(14px * var(--od-scale)); }
    .ds-table th, .ds-table td { padding: calc(12px * var(--od-density)) calc(14px * var(--od-density)); text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: var(--fs-12); letter-spacing: 0.04em; text-transform: uppercase; }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      aspect-ratio: 16 / 10;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--fs-12);
      letter-spacing: 0.04em;
    }
    .ph-img.square    { aspect-ratio: 1 / 1; }
    .ph-img.portrait  { aspect-ratio: 3 / 4; }
    .ph-img.wide      { aspect-ratio: 16 / 9; }

    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }
    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }

    .hero          { padding-block: clamp(calc(80px * var(--od-density)), 12vw, calc(160px * var(--od-density))); }
    .hero-center   { text-align: center; max-width: 32ch; margin-inline: auto; }
    .hero h1       { margin-bottom: var(--gap-md); }
    .hero .lead    { margin-bottom: var(--gap-lg); }
    .hero-cta      { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }
    .hero-center .hero-cta { justify-content: center; }
    .hero-split    { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }
    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }

    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: calc(22px * var(--od-density)) 0; border-top: 1px solid var(--border); align-items: baseline; }
    .log-row .meta { color: var(--muted); }
    .log-row h3 { font-size: calc(19px * var(--od-scale)); }
    .log-row .pull { text-align: right; }

    @media (prefers-reduced-motion: reduce) {
      .btn, .btn-arrow::after, .topnav nav a { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topnav" data-od-id="topnav" data-od-label="Top navigation">
    <div class="container topnav-inner">
      <span class="logo" data-od-id="topnav-logo" data-od-label="Brand logo">[REPLACE] Brand</span>
      <nav data-od-id="topnav-links" data-od-label="Nav links">
        <a href="#">[REPLACE] Link 1</a>
        <a href="#">[REPLACE] Link 2</a>
        <a href="#">[REPLACE] Link 3</a>
      </nav>
      <button class="btn btn-primary" data-od-id="topnav-cta" data-od-label="Nav CTA">[REPLACE] CTA</button>
    </div>
  </header>

  <main id="content" data-od-id="content" data-od-label="Page content">
    <section class="section hero" data-od-id="hero" data-od-label="Hero">
      <div class="container hero-center">
        <p class="eyebrow" data-od-id="hero-eyebrow" data-od-label="Hero eyebrow">[REPLACE] Eyebrow</p>
        <h1 data-od-id="hero-title" data-od-label="Hero title">[REPLACE] One sharp sentence about what this is.</h1>
        <p class="lead" data-od-id="hero-lead" data-od-label="Hero lead">[REPLACE] One subhead sentence — concrete value, not a tagline.</p>
        <div class="hero-cta" data-od-id="hero-cta" data-od-label="Hero CTAs">
          <button class="btn btn-primary">[REPLACE] Primary CTA</button>
          <button class="btn btn-secondary">[REPLACE] Secondary</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="pagefoot" data-od-id="footer" data-od-label="Footer">
    <div class="container row-between">
      <span>© [REPLACE] Brand · [REPLACE] Year</span>
      <span class="meta">[REPLACE] tagline · contact@example.com</span>
    </div>
  </footer>
</body>
</html>
