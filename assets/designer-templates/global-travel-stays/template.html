<title>Hearthaway — Stays</title>
<style>
:root {
  --od-accent: #ff5a5f;
  --od-scale: 1;
  --od-density: 1;
  --od-motion: 1;
  --brand: var(--od-accent);
  --bg-page: #efece8;
  --bg-app: #ffffff;
  --fg: #222222;
  --fg-muted: #717171;
  --hairline: #ebebeb;
  --chip-active: #222222;
  --on-dark: #ffffff;
  --star: #222222;
  --shadow-search: 0 3px 12px rgba(34, 34, 34, 0.12);
  --shadow-card: 0 1px 4px rgba(34, 34, 34, 0.08);
  --photo-1a: #cfe0d8;
  --photo-1b: #7da08c;
  --photo-1c: #3f5c4d;
  --photo-2a: #f0ddc8;
  --photo-2b: #cf9a62;
  --photo-2c: #7a5230;
  --photo-3a: #d4e2ec;
  --photo-3b: #88a8bd;
  --photo-3c: #45617a;
  --fs-search: calc(14px * var(--od-scale));
  --fs-title: calc(15px * var(--od-scale));
  --fs-body: calc(14px * var(--od-scale));
  --fs-meta: calc(13px * var(--od-scale));
  --fs-chip: calc(11px * var(--od-scale));
  --pad: calc(20px * var(--od-density));
  --gap: calc(12px * var(--od-density));
  --dur: calc(0.16s * var(--od-motion));
}
html[data-od-mode="dark"] {
  --bg-page: #0d0d0d;
  --bg-app: #161616;
  --fg: #f1f1f1;
  --fg-muted: #9c9c9c;
  --hairline: #2b2b2b;
  --chip-active: #f1f1f1;
  --on-dark: #161616;
  --star: #f1f1f1;
  --shadow-search: 0 3px 12px rgba(0, 0, 0, 0.55);
  --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.45);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: var(--fs-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.phone {
  max-width: 480px;
  min-height: 100dvh;
  margin-inline: auto;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 0 1px var(--hairline), 0 24px 60px rgba(34, 34, 34, 0.1);
}
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(8px * var(--od-density)) var(--pad) calc(4px * var(--od-density));
  font-size: calc(12px * var(--od-scale));
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.statusbar .glyphs { display: flex; gap: 5px; align-items: center; }
.search-wrap { padding: calc(8px * var(--od-density)) var(--pad) calc(4px * var(--od-density)); }
.search-pill {
  width: 100%;
  display: flex;
  align-items: center;
  gap: var(--gap);
  padding: calc(11px * var(--od-density)) calc(16px * var(--od-density));
  border-radius: 999px;
  background: var(--bg-app);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-search);
  text-align: left;
  transition: transform var(--dur) ease;
}
.search-pill:active { transform: scale(0.98); }
.search-pill .q { flex: 1; }
.search-pill .q b { display: block; font-size: var(--fs-search); font-weight: 600; }
.search-pill .q span { font-size: calc(12px * var(--od-scale)); color: var(--fg-muted); }
.search-filter {
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid var(--hairline);
  display: grid;
  place-items: center;
  flex: none;
}
.cats {
  display: flex;
  gap: calc(26px * var(--od-density));
  padding: calc(14px * var(--od-density)) var(--pad) 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--hairline);
}
.cats::-webkit-scrollbar { display: none; }
.cat {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding-bottom: calc(10px * var(--od-density));
  color: var(--fg-muted);
  font-size: var(--fs-chip);
  font-weight: 600;
  border-bottom: 2px solid transparent;
  transition: color var(--dur) ease;
}
.cat.active { color: var(--fg); border-bottom-color: var(--fg); }
.cat:active { color: var(--fg); }
.feed { flex: 1; overflow-y: auto; padding: calc(18px * var(--od-density)) var(--pad) calc(150px * var(--od-density)); display: flex; flex-direction: column; gap: calc(28px * var(--od-density)); }
.listing { text-align: left; }
.listing-media {
  aspect-ratio: 20 / 19;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  margin-bottom: calc(10px * var(--od-density));
  box-shadow: var(--shadow-card);
}
.lm-1 {
  background:
    radial-gradient(110% 60% at 70% 0%, var(--photo-1a) 0%, transparent 60%),
    linear-gradient(165deg, var(--photo-1a) 0%, var(--photo-1b) 55%, var(--photo-1c) 100%);
}
.lm-1::after {
  content: "";
  position: absolute;
  inset: 58% 12% 14%;
  background: linear-gradient(180deg, var(--bg-app), var(--photo-1a));
  border-radius: 8px 8px 2px 2px;
  box-shadow: -28px 16px 0 -6px var(--photo-1c);
  opacity: 0.92;
}
.lm-2 {
  background:
    radial-gradient(100% 55% at 30% 0%, var(--photo-2a) 0%, transparent 62%),
    linear-gradient(150deg, var(--photo-2a) 0%, var(--photo-2b) 58%, var(--photo-2c) 100%);
}
.lm-2::after {
  content: "";
  position: absolute;
  left: 16%;
  right: 16%;
  bottom: 0;
  height: 34%;
  background: linear-gradient(180deg, var(--photo-2c), transparent);
  clip-path: polygon(0 100%, 18% 22%, 38% 70%, 58% 8%, 80% 58%, 100% 30%, 100% 100%);
  opacity: 0.55;
}
.lm-3 {
  background:
    radial-gradient(120% 58% at 50% 0%, var(--photo-3a) 0%, transparent 64%),
    linear-gradient(172deg, var(--photo-3a) 0%, var(--photo-3b) 52%, var(--photo-3c) 100%);
}
.lm-3::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 30%;
  background: repeating-linear-gradient(90deg, var(--photo-3c) 0 3px, transparent 3px 26px), linear-gradient(180deg, transparent, var(--photo-3c));
  opacity: 0.45;
}
.fav {
  position: absolute;
  top: 12px;
  right: 12px;
  color: var(--on-dark);
  transition: transform var(--dur) ease;
}
.fav:active { transform: scale(0.8); }
.fav.saved { color: var(--brand); }
.fav svg { filter: drop-shadow(0 1px 2px rgba(34, 34, 34, 0.4)); }
.badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: var(--bg-app);
  color: var(--fg);
  font-size: calc(12px * var(--od-scale));
  font-weight: 600;
  padding: 5px 11px;
  border-radius: 999px;
  box-shadow: var(--shadow-card);
}
.media-dots {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 5px;
}
.media-dots i {
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--on-dark);
  opacity: 0.55;
}
.media-dots i.on { opacity: 1; }
.listing-row { display: flex; justify-content: space-between; gap: var(--gap); }
.listing-title { font-size: var(--fs-title); font-weight: 600; margin: 0; }
.rating { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-meta); color: var(--star); flex: none; }
.listing-sub { color: var(--fg-muted); font-size: var(--fs-meta); margin: 2px 0 0; }
.listing-price { margin: 6px 0 0; font-size: var(--fs-title); }
.listing-price b { font-weight: 600; }
.listing-price span { font-weight: 400; }
.map-pill {
  position: fixed;
  bottom: calc(92px * var(--od-density));
  left: 50%;
  transform: translateX(-50%);
  background: var(--chip-active);
  color: var(--on-dark);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: calc(11px * var(--od-density)) calc(18px * var(--od-density));
  border-radius: 999px;
  font-size: calc(13px * var(--od-scale));
  font-weight: 600;
  box-shadow: 0 6px 18px rgba(34, 34, 34, 0.3);
  transition: transform var(--dur) ease;
  z-index: 2;
}
.map-pill:active { transform: translateX(-50%) scale(0.95); }
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin-inline: auto;
  background: var(--bg-app);
  border-top: 1px solid var(--hairline);
  display: flex;
  justify-content: space-around;
  padding: calc(8px * var(--od-density)) var(--pad) calc(20px * var(--od-density));
}
.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  color: var(--fg-muted);
  font-size: calc(10px * var(--od-scale));
  font-weight: 500;
  transition: color var(--dur) ease, transform var(--dur) ease;
}
.tab:active { transform: scale(0.92); }
.tab.active { color: var(--brand); }
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
