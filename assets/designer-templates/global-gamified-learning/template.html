<!-- SenWeaverCoding built-in template -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lingosprout — Learn</title>
<style>
:root {
  --od-accent: #58cc02;
  --od-scale: 1;
  --od-density: 1;
  --od-motion: 1;
  --brand: var(--od-accent);
  --brand-deep: #46a302;
  --brand-soft: #d7ffb8;
  --bg-page: #e8f4dc;
  --bg-app: #ffffff;
  --fg: #3c3c3c;
  --fg-muted: #afafaf;
  --hairline: #e5e5e5;
  --on-brand: #ffffff;
  --gold: #ffc800;
  --gold-deep: #e6a800;
  --gem: #1cb0f6;
  --gem-deep: #1899d6;
  --heart: #ff4b4b;
  --flame: #ff9600;
  --locked: #e5e5e5;
  --locked-deep: #cfcfcf;
  --locked-fg: #b7b7b7;
  --unit-banner: var(--od-accent);
  --node-ring: #ffffff;
  --mascot-body: #8ee000;
  --mascot-belly: #d7ffb8;
  --fs-stat: calc(15px * var(--od-scale));
  --fs-unit: calc(17px * var(--od-scale));
  --fs-body: calc(14px * var(--od-scale));
  --fs-meta: calc(12px * var(--od-scale));
  --pad: calc(16px * var(--od-density));
  --gap: calc(12px * var(--od-density));
  --dur: calc(0.14s * var(--od-motion));
  --pulse-dur: calc(1.8s * var(--od-motion));
}
html[data-od-mode="dark"] {
  --bg-page: #0f1a08;
  --bg-app: #141f0c;
  --fg: #ecf4e4;
  --fg-muted: #7d8a72;
  --hairline: #28361c;
  --brand-soft: #2a4413;
  --locked: #28361c;
  --locked-deep: #1d2913;
  --locked-fg: #5c6b50;
  --node-ring: #141f0c;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: var(--fs-body);
  font-weight: 500;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.phone {
  max-width: 480px;
  min-height: 100dvh;
  margin-inline: auto;
  background: var(--bg-app);
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 0 1px var(--hairline);
}
.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(8px * var(--od-density)) var(--pad) calc(4px * var(--od-density));
  font-size: var(--fs-meta);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.statusbar .glyphs { display: flex; gap: 5px; align-items: center; }
.statbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(8px * var(--od-density)) var(--pad);
  border-bottom: 2px solid var(--hairline);
}
.stat {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-stat);
  font-weight: 800;
  transition: transform var(--dur) ease;
}
.stat:active { transform: scale(0.92); }
.stat.flag { gap: 0; }
.flag-chip {
  width: 30px;
  height: 22px;
  border-radius: 5px;
  background: linear-gradient(180deg, var(--brand) 0 50%, var(--gold) 50% 100%);
  border: 1px solid var(--hairline);
}
.stat.streak { color: var(--flame); }
.stat.gems { color: var(--gem); }
.stat.hearts { color: var(--heart); }
.path-scroll { flex: 1; overflow-y: auto; padding-bottom: calc(96px * var(--od-density)); }
.unit-banner {
  margin: var(--pad);
  background: var(--unit-banner);
  border-radius: 16px;
  padding: calc(16px * var(--od-density)) calc(18px * var(--od-density));
  color: var(--on-brand);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  box-shadow: 0 4px 0 var(--brand-deep);
}
.unit-meta { font-size: var(--fs-meta); font-weight: 700; opacity: 0.85; margin: 0 0 2px; text-transform: uppercase; letter-spacing: 0.04em; }
.unit-title { font-size: var(--fs-unit); font-weight: 800; margin: 0; }
.unit-guide {
  flex: none;
  border-left: 2px solid rgba(255, 255, 255, 0.35);
  padding-left: calc(14px * var(--od-density));
  transition: transform var(--dur) ease;
}
.unit-guide:active { transform: scale(0.9); }
.path { position: relative; display: flex; flex-direction: column; align-items: center; gap: calc(22px * var(--od-density)); padding: calc(8px * var(--od-density)) 0 calc(28px * var(--od-density)); }
.node-row { display: flex; justify-content: center; width: 100%; }
.shift-l { transform: translateX(calc(-52px * var(--od-density))); }
.shift-r { transform: translateX(calc(52px * var(--od-density))); }
.node {
  width: calc(68px * var(--od-density));
  height: calc(62px * var(--od-density));
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: var(--on-brand);
  position: relative;
  background: var(--brand);
  box-shadow: 0 7px 0 var(--brand-deep);
  transition: transform var(--dur) ease, box-shadow var(--dur) ease;
}
.node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--brand-deep); }
.node.gold { background: var(--gold); box-shadow: 0 7px 0 var(--gold-deep); }
.node.gold:active { box-shadow: 0 2px 0 var(--gold-deep); }
.node.locked { background: var(--locked); box-shadow: 0 7px 0 var(--locked-deep); color: var(--locked-fg); }
.node.locked:active { box-shadow: 0 2px 0 var(--locked-deep); }
.node.active::before {
  content: "";
  position: absolute;
  inset: -9px;
  border-radius: 999px;
  border: 4px solid var(--brand-soft);
  animation: pulse var(--pulse-dur) ease-in-out infinite;
}
.start-tip {
  position: absolute;
  top: calc(-44px * var(--od-density));
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-app);
  border: 2px solid var(--hairline);
  border-radius: 12px;
  padding: 7px 14px;
  font-size: calc(13px * var(--od-scale));
  font-weight: 800;
  color: var(--brand);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
  animation: bob calc(2.2s * var(--od-motion)) ease-in-out infinite;
}
.start-tip::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -7px;
  width: 12px;
  height: 12px;
  background: var(--bg-app);
  border-right: 2px solid var(--hairline);
  border-bottom: 2px solid var(--hairline);
  transform: translateX(-50%) rotate(45deg);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.55; }
}
@keyframes bob {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-5px); }
}
.mascot-row { display: flex; justify-content: center; width: 100%; }
.mascot { transform: translateX(calc(76px * var(--od-density))); margin-top: calc(-66px * var(--od-density)); }
.chest {
  background: none;
  color: var(--gold);
}
.next-unit {
  margin: 0 var(--pad);
  border-top: 2px solid var(--hairline);
  padding-top: calc(18px * var(--od-density));
  text-align: center;
}
.next-unit h3 { margin: 0 0 4px; font-size: calc(15px * var(--od-scale)); font-weight: 800; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; }
.next-unit p { margin: 0 0 calc(14px * var(--od-density)); color: var(--fg-muted); }
.btn-3d {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: calc(13px * var(--od-density));
  border-radius: 14px;
  background: var(--bg-app);
  border: 2px solid var(--hairline);
  border-bottom-width: 5px;
  font-size: calc(14px * var(--od-scale));
  font-weight: 800;
  color: var(--gem);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  transition: transform var(--dur) ease, border-bottom-width var(--dur) ease;
}
.btn-3d:active { transform: translateY(3px); border-bottom-width: 2px; }
.btn-3d.solid {
  background: var(--brand);
  border-color: var(--brand-deep);
  color: var(--on-brand);
}
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin-inline: auto;
  background: var(--bg-app);
  border-top: 2px solid var(--hairline);
  display: flex;
  justify-content: space-around;
  padding: calc(8px * var(--od-density)) var(--pad) calc(18px * var(--od-density));
}
.tab {
  padding: 6px 10px;
  border-radius: 12px;
  border: 2px solid transparent;
  color: var(--fg-muted);
  transition: transform var(--dur) ease;
}
.tab:active { transform: scale(0.9); }
.tab.active { border-color: var(--gem); background: color-mix(in srgb, var(--gem) 12%, transparent); color: var(--gem); }
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<div class="phone" data-od-id="phone-shell" data-od-label="App shell">
  <header class="statusbar" data-od-id="status-bar" data-od-label="Status bar">
    <span>9:41</span>
    <span class="glyphs">
      <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 9.5v-2M5 9.5v-4M8.5 9.5v-6M12 9.5v-8" stroke-linecap="round"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.5 4.2a8.5 8.5 0 0 1 12 0M3.8 6.6a5.2 5.2 0 0 1 7.4 0M6.2 8.9a1.9 1.9 0 0 1 2.6 0" stroke-linecap="round"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="1.5" width="17" height="8" rx="2.4"/><rect x="2.6" y="3.1" width="11" height="4.8" rx="1.2" fill="currentColor" stroke="none"/><path d="M19.6 4v3" stroke-linecap="round"/></svg>
    </span>
  </header>

  <section class="statbar" data-od-id="stat-bar" data-od-label="Streak and currency stats">
    <button class="stat flag" data-od-id="stat-course" data-od-label="Active course" aria-label="Course: Portuguese">
      <span class="flag-chip"></span>
    </button>
    <button class="stat streak" data-od-id="stat-streak" data-od-label="Day streak">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.6 3.2-.8 4.9-2.4 6.6C8 10.8 6.5 12.4 6.5 15a5.5 5.5 0 0 0 11 0c0-1.8-.7-3.1-1.6-4.4-.4 1-1 1.7-1.9 2.2.3-2.9-.5-7.3-2-10.3Z"/></svg>
      47
    </button>
    <button class="stat gems" data-od-id="stat-gems" data-od-label="Gem balance">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 3.5h10l4 5.5-9 11.5L3 9l4-5.5Z"/><path d="M3 9h18M9.5 3.5 12 9l2.5-5.5M12 9v11.5" fill="none" stroke="var(--bg-app)" stroke-width="1.1"/></svg>
      1,260
    </button>
    <button class="stat hearts" data-od-id="stat-hearts" data-od-label="Hearts remaining">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.9c0 5.4-7.5 10-7.5 10Z"/></svg>
      5
    </button>
  </section>

  <main class="path-scroll" data-od-id="lesson-area">
    <section class="unit-banner" data-od-id="unit-banner" data-od-label="Current unit banner">
      <div>
        <p class="unit-meta">Section 2 · Unit 4</p>
        <h2 class="unit-title">Order food at a café</h2>
      </div>
      <button class="unit-guide" data-od-id="cta-guidebook" data-od-label="Open guidebook" aria-label="Guidebook">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4.5h10a2.5 2.5 0 0 1 2.5 2.5v12.5H7A2 2 0 0 1 5 17.5v-13Z" stroke-linejoin="round"/><path d="M5 16.5a2 2 0 0 1 2-2h10.5M9 8.5h5" stroke-linecap="round"/></svg>
      </button>
    </section>

    <section class="path" data-od-id="lesson-path" data-od-label="Lesson path">
      <div class="node-row">
        <button class="node gold" data-od-id="node-review-1" data-od-label="Completed lesson" aria-label="Greetings — completed">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5.5 12.5 4.2 4.2 8.8-9.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="node-row shift-l">
        <button class="node gold" data-od-id="node-review-2" data-od-label="Completed lesson" aria-label="Numbers — completed">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5.5 12.5 4.2 4.2 8.8-9.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="node-row">
        <button class="node active" data-od-id="node-active" data-od-label="Active lesson" aria-label="Ordering drinks — start">
          <span class="start-tip">Start</span>
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5-12-7.5Z"/></svg>
        </button>
      </div>
      <div class="mascot-row" data-od-id="mascot" data-od-label="Mascot">
        <svg class="mascot" width="84" height="84" viewBox="0 0 84 84" fill="none">
          <ellipse cx="42" cy="50" rx="26" ry="28" fill="var(--mascot-body)"/>
          <ellipse cx="42" cy="58" rx="15" ry="16" fill="var(--mascot-belly)"/>
          <circle cx="33" cy="40" r="7" fill="var(--node-ring)"/>
          <circle cx="51" cy="40" r="7" fill="var(--node-ring)"/>
          <circle cx="34.5" cy="41" r="3" fill="var(--fg)"/>
          <circle cx="49.5" cy="41" r="3" fill="var(--fg)"/>
          <path d="M38 50.5 42 54l4-3.5" stroke="var(--gold-deep)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="var(--gold)"/>
          <path d="M20 30c-4-8 2-16 8-17M64 30c4-8-2-16-8-17" stroke="var(--mascot-body)" stroke-width="6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="node-row shift-r">
        <button class="node locked" data-od-id="node-locked-1" data-od-label="Locked lesson" aria-label="At the counter — locked">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5.5" y="10.5" width="13" height="9" rx="2.4"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="node-row">
        <button class="node locked chest" data-od-id="node-chest" data-od-label="Reward chest" aria-label="Reward chest — locked">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9.5A3.5 3.5 0 0 1 7.5 6h9A3.5 3.5 0 0 1 20 9.5V11H4V9.5ZM4 12.5h16V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4.5Z"/><rect x="10.6" y="10" width="2.8" height="5" rx="1" fill="var(--gold-deep)"/></svg>
        </button>
      </div>
      <div class="node-row shift-l">
        <button class="node locked" data-od-id="node-locked-2" data-od-label="Locked lesson" aria-label="Paying the bill — locked">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5.5" y="10.5" width="13" height="9" rx="2.4"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </section>

    <section class="next-unit" data-od-id="next-unit" data-od-label="Next unit teaser">
      <h3>Up next · Unit 5</h3>
      <p>Ask for directions around town</p>
      <button class="btn-3d" data-od-id="cta-jump" data-od-label="Jump ahead test">Test out to skip</button>
    </section>
  </main>

  <nav class="tabbar" data-od-id="tab-bar" data-od-label="Bottom tab bar">
    <button class="tab active" data-od-id="tab-learn" data-od-label="Learn tab" aria-label="Learn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.2 12 3.5l8 6.7V20a1 1 0 0 1-1 1h-4.6v-6.2H9.6V21H5a1 1 0 0 1-1-1v-9.8Z" stroke-linejoin="round"/></svg>
    </button>
    <button class="tab" data-od-id="tab-sounds" data-od-label="Sounds tab" aria-label="Sounds">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3v-5Z" stroke-linejoin="round"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" stroke-linecap="round"/></svg>
    </button>
    <button class="tab" data-od-id="tab-quests" data-od-label="Quests tab" aria-label="Quests">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3.5h8v5.2a4 4 0 0 1-8 0V3.5Z" stroke-linejoin="round"/><path d="M8 5H4.5a3.5 3.5 0 0 0 3.6 3.5M16 5h3.5a3.5 3.5 0 0 1-3.6 3.5M12 12.7v3M8.5 20.5h7M10 18l2-2.3 2 2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tab" data-od-id="tab-leagues" data-od-label="Leagues tab" aria-label="Leagues">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5 14.4 8l5.1.7-3.7 3.5.9 5-4.7-2.4L7.3 17.2l.9-5L4.5 8.7 9.6 8 12 3.5Z" stroke-linejoin="round"/></svg>
    </button>
    <button class="tab" data-od-id="tab-shop" data-od-label="Shop tab" aria-label="Shop">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8.5h14l-1.2 11a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8.5Z" stroke-linejoin="round"/><path d="M8.8 11V7a3.2 3.2 0 0 1 6.4 0v4" stroke-linecap="round"/></svg>
    </button>
  </nav>
</div>
</body>
</html>
