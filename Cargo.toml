[workspace]
members = [
    ".",
    "crates/sen-core",
    "crates/sen-channels",
    "crates/sen-tui",
    "crates/sen-cli",
    "desktop/src-tauri",
]
resolver = "2"

[lints.rust]
# Phase 7 M1 — final workspace-level lint floor.  The settings below
# are the invariants every contributor must respect; the crate-root
# `#![allow(...)]` block in `src/lib.rs` covers the known *reserved
# API* inventory (see docs/reserved-api.md).  `unsafe_code` stays at
# warn (not deny) because the workspace contains legitimate FFI shims
# — every `unsafe` block carries a `// SAFETY:` comment and a
# per-site `#[allow(unsafe_code)]`.
unsafe_code = "warn"
unused_must_use = "warn"
# `dead_code` is held at warn here so *new* dead code surfaces as a
# warning during CI even though the crate-root allow silences the
# known reserved-API inventory.
dead_code = "warn"

[lints.clippy]
# Phase 7 M1 — final workspace-level clippy floor.  `todo` and
# `unimplemented` are hard-denied at the manifest level so placeholder
# code cannot be committed regardless of per-file allows.  The other
# entries keep debug-only or obviously-bad patterns visible.
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
print_stderr = "allow"          # CLI/TUI legitimately write diagnostics to stderr
print_stdout = "allow"          # CLI commands intentionally print results

[package]
name = "SenWeaverCoding"
version = "0.1.0"
edition = "2024"
authors = ["senweaver"]
license = "MIT"
description = "SenWeaverCoding - AI Code Editor built in Rust."
repository = "https://github.com/senweaver/SenWeaverCoding"
readme = "README.md"
keywords = ["ai", "code-editor", "cli", "coding", "framework"]
categories = ["command-line-utilities", "ai", "asynchronous"]
rust-version = "1.87"

include = [
  "/src/**/*",
  "/docs/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
  "/tool_descriptions/**/*",
]

[[bin]]
name = "sen"
path = "src/main.rs"

[[bin]]
name = "bench_check"
path = "dev/bench_check.rs"
# Auxiliary CLI that parses criterion's JSON output and reports
# regressions; excluded from end-user install via --bin selection in
# release packaging.  Standalone so it compiles without the full
# agent runtime.
test = false
bench = false
doc = false
required-features = []

[[bin]]
name = "evals_runner"
path = "dev/evals_runner.rs"
# Phase 7 M7 — nightly evals harness.  Drives the concurrent runner
# over HumanEval/MBPP/SWE-bench-lite suites with a trivial echo
# executor so CI can validate fixture parsing, concurrency plumbing
# and the `sen_evals_suite_seconds` histogram without needing provider
# credentials.  Excluded from the end-user install.
test = false
bench = false
doc = false
required-features = []

[lib]
name = "senweavercoding"
path = "src/lib.rs"

[dependencies]
# CLI - minimal and fast
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# Async runtime - feature-optimized for size
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false, features = ["fs", "sync"] }

# HTTP client - minimal features
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks"] }

# Matrix client + E2EE decryption
matrix-sdk = { version = "0.16", optional = true, default-features = false, features = ["e2e-encryption", "rustls-tls", "markdown", "sqlite"] }

# Serialization
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Config
directories = "6.0"
toml = "1.0"
# Phase 3 D6 — prompt_guard rule files are authored in YAML (see
# `security::prompt_guard_yaml`).  `serde_yaml` is on "soft-archive" at
# upstream but remains the most interoperable Rust YAML parser; we pin
# to a conservative version and can swap to a fork (e.g. `serde_yml`)
# in a dedicated sprint without touching consumer code.
serde_yaml = "0.9"
shellexpand = "3.1"

# JSON Schema generation for config export
schemars = "1.2"

# Logging - minimal
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

# Observability - Prometheus metrics (optional; requires AtomicU64, unavailable on 32-bit)
prometheus = { version = "0.14", default-features = false, optional = true }

# Base64 encoding (screenshots, image data)
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }

# URL encoding for web search
urlencoding = "2.1"

# HTML to plain text conversion (web_fetch tool)
nanohtml2text = "0.2"

# Load .env files for development convenience
dotenvy = "0.15"

# Optional Rust-native browser automation backend
fantoccini = { version = "0.22.1", optional = true, default-features = false, features = ["rustls-tls"] }

# Compile-time plugin registration for slash commands
inventory = "0.3"

# Phase 6 M4 — cross-platform filesystem watcher used by the
# incremental SymbolGraph builder.  Gated behind `fs-watch` so
# minimal builds (e.g. `--no-default-features`) keep their
# dependency surface unchanged.
notify = { version = "8.2", optional = true }


# Temp files (update pipeline rollback)
tempfile = "3.26"

# Tar/gzip extraction (update pipeline)
flate2 = "1.1"
tar = "0.4"

# Zip extraction for skill / extension / registry installers
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Glob pattern matching for permission rules (pure string → pattern compilation)
globset = "0.4"

# Aardvark I2C/SPI/GPIO USB adapter (Total Phase) - stub when SDK absent
# aardvark-sys = { path = "firmware/aardvark-sys", version = "0.1.0" }

# UUID generation
uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

# Authenticated encryption (AEAD) for secret store
chacha20poly1305 = "0.10"

# HMAC for webhook signature verification
hmac = "0.12"
sha2 = "0.10"
similar = "2"
aho-corasick = "1.1"
memchr = "2.5"
hex = "0.4"

# CSPRNG for secure token generation
rand = "0.10"

# Portable atomic fallbacks for targets without native 64-bit atomics
portable-atomic = "1"

# serde-big-array for wa-rs storage (large array serialization)
serde-big-array = { version = "0.5", optional = true }

# Fast mutexes that don't poison on panic
parking_lot = "0.12"

# Concurrent HashMap for O(1) tool registry lookups
dashmap = "5"

# Lazy static initialization for cached schemas
once_cell = "1"

# Async traits
async-trait = "0.1"

# HMAC-SHA256 (Zhipu/GLM JWT auth)
ring = "0.17"

# Protobuf encode/decode (Lark WS frame codec, WhatsApp storage)
prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }

# Memory / persistence
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
cron = "0.15"

# Interactive CLI prompts
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"

# Filesystem traversal with glob patterns (distinct from `globset` which
# only compiles patterns; `glob::glob` also iterates the filesystem).
glob = "0.3"

# Binary discovery (init system detection)
which = "8.0"

# WebSocket client channels (Discord/Lark/DingTalk/Nostr)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }

# Phase 5 / Task 5.2 — Chase-Lev work-stealing deques used by
# `ParallelExecutor` (per-worker `Worker<QueuedTask>`, global
# `Injector<QueuedTask>`, and `Stealer` handles for cross-worker
# stealing) and CPU-count detection for the default worker pool
# size.
crossbeam-deque = "0.8"
num_cpus = "1.16"
nostr-sdk = { version = "0.44", default-features = false, features = ["nip04", "nip59"], optional = true }
regex = "1.10"
hostname = "0.4.2"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1.14.0"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"

# email
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
mail-parser = "0.11.2"
async-imap = { version = "0.11",features = ["runtime-tokio"], default-features = false }

# HTTP server (gateway) - replaces raw TCP for proper HTTP/1.1 compliance
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "cors"] }
http-body-util = "0.1"

# Embed frontend assets into binary (web dashboard)
# rust-embed and mime_guess removed — web dashboard not needed for CLI

# OpenTelemetry - OTLP trace + metrics export.
# Use the blocking HTTP exporter client to avoid Tokio-reactor panics in
# OpenTelemetry background batch threads when SenWeaverCoding emits spans/metrics from
# non-Tokio contexts.
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots"], optional = true }

# Serial port for peripheral communication (STM32, etc.)
tokio-serial = { version = "5", default-features = false, optional = true }
ordered-float = "5.3.0"
arc-swap = "1.9.1"
zeroize = { version = "1.8.2", features = ["derive"] }

# USB device enumeration (hardware discovery) - only on platforms nusb supports
# (Linux, macOS, Windows). Android/Termux uses target_os="android" and is excluded.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nusb = { version = "0.2", default-features = false, optional = true }

# probe-rs for STM32/Nucleo memory read (Phase B)
probe-rs = { version = "0.31", optional = true }

# PDF extraction for datasheet RAG (optional, enable with --features rag-pdf)
pdf-extract = { version = "0.10", optional = true }

# WASM plugin runtime (extism)
extism = { version = "1.20", optional = true }
# WASM sandbox runtime (wasmi interpreter)
wasmi = { version = "0.42", optional = true }

# TUI (Terminal User Interface) - optional, enable with --features tui
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }

# Syntax highlighting for the TUI code-block renderer (also reused by
# any future surface that wants text-mode rendering of source files).
syntect = { version = "5.0", optional = true }

ropey = "1.6"

# Phase 3 D4.3 — full-text code index.  `tantivy` is heavy to compile
# so it is behind an opt-in feature (`code-search`); the fallback
# scanner in `code_intel::search::heuristic` always builds and keeps
# the `tools::code_search` tool functional on minimal builds.
tantivy = { version = "0.22", optional = true }

# Syntax parsing: tree-sitter incremental parser + highlight queries
tree-sitter = { version = "0.24", optional = true }
tree-sitter-highlight = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.3", optional = true }
# Phase 2 — additional grammar packs for the SyntacticVerifier /
# post-apply validator.  Each is gated behind its own subfeature so a
# minimal `code-intel` build does not pay the compile cost when the
# language is irrelevant.  All four are bundled into the umbrella
# `code-intel` feature for the default build (mirroring how the
# Rust/Python/JS grammars are bundled today).
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
# `tree-sitter ≥ 0.24` changed `QueryCursor::matches` to return a
# `StreamingIterator`; the trait is only accessible via the
# `streaming-iterator` crate (the upstream re-export is private).
# Pulled in alongside the tree-sitter feature bundle.
streaming-iterator = { version = "0.1", optional = true }

# Debug Adapter Protocol client
# (DAP uses JSON-RPC over stdio, similar to LSP — no extra crate needed beyond serde_json + tokio)

# Windows API for console detachment and global hotkeys
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"], optional = true }

# Cross-platform audio capture for voice wake word detection (optional, enable with --features voice-wake)
cpal = { version = "0.15", optional = true }

# Terminal QR rendering for WhatsApp Web pairing flow.
qrcode = { version = "0.14", optional = true }

# WhatsApp Web client (wa-rs) - optional, enable with --features whatsapp-web
# Uses wa-rs for Bot and Client, wa-rs-core for storage traits, custom rusqlite backend avoids Diesel conflict.
wa-rs = { version = "0.2", optional = true, default-features = false }
wa-rs-core = { version = "0.2", optional = true, default-features = false }
wa-rs-binary = { version = "0.2", optional = true, default-features = false }
wa-rs-proto = { version = "0.2", optional = true, default-features = false }
wa-rs-ureq-http = { version = "0.2", optional = true }
wa-rs-tokio-transport = { version = "0.2", optional = true, default-features = false }

# Raspberry Pi GPIO / Landlock (Linux only) - target-specific to avoid compile failure on macOS
[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22", optional = true }
landlock = { version = "0.4", optional = true }

# Unix-specific dependencies (for root check, etc.)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["observability-prometheus", "skill-creation", "fs-watch", "sandbox", "tool-cron", "tool-sop", "tool-team", "tool-cloud-ops", "tool-reports", "tool-linkedin", "tool-pushover", "tool-search-social", "tool-productivity", "tool-utility-misc", "tool-image", "lsp-push-diagnostics"]
tui = ["dep:ratatui", "dep:crossterm", "dep:syntect"]
# Phase 3 D4.2 — `code-intel` is the public hand-off for tree-sitter
# parsing.  It was previously bundled inside `gui` so headless surfaces
# (CLI, TUI, gateway) could not use outline / symbol extraction.  The
# feature collects all tree-sitter grammars so `src/code_intel/` and
# `tools::code_outline` compile on every target; `gui` simply depends
# on it to preserve existing behaviour.
code-intel = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-md",
    "dep:streaming-iterator",
    # Phase 2 — extra grammars are folded in here so the umbrella
    # `code-intel` feature continues to be the single switch users flip.
    "code-intel-go",
    "code-intel-java",
    "code-intel-c",
    "code-intel-cpp",
]
# Phase 2 — per-language subfeatures.  These exist so power users (or
# CI pipelines that build for cross-compilation targets where one of
# the grammar crates fails to build) can opt out granularly without
# losing the rest of the syntactic verifier.
code-intel-go = ["dep:tree-sitter-go"]
code-intel-java = ["dep:tree-sitter-java"]
code-intel-c = ["dep:tree-sitter-c"]
code-intel-cpp = ["dep:tree-sitter-cpp"]
# Phase 3 D4.3 — enables the tantivy-backed full-text index used by
# `tools::code_search`.  Disabled by default so minimal builds keep
# their compile times.
code-search = ["dep:tantivy"]
channel-nostr = ["dep:nostr-sdk"]
# Phase 3 D1 — feature flag placeholders for channel adapters that are
# referenced by `#[cfg(feature = ...)]` in `gateway/routes/channels.rs`.
# These channels are implemented inline under the default feature set
# (via `channels::*`), so the features are declared empty to silence
# `unexpected-cfgs` warnings without altering link behavior.  Enabling a
# feature is the hook for a future extraction to optional deps.
channel-telegram = []
channel-slack = []
channel-discord = []
channel-dingtalk = []
channel-wechat = []
channel-email = []
channel-line = []
channel-twilio = []
hardware = ["nusb", "tokio-serial"]
channel-matrix = ["dep:matrix-sdk"]
channel-lark = ["dep:prost"]
channel-feishu = ["channel-lark"]  # Alias for Feishu users (Lark and Feishu are the same platform)
observability-prometheus = ["dep:prometheus"]
observability-otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
peripheral-rpi = ["rppal"]
# Browser backend feature alias used by cfg(feature = "browser-native")
browser-native = ["dep:fantoccini"]
# Backward-compatible alias for older invocations
fantoccini = ["browser-native"]
# Sandbox feature aliases used by cfg(feature = "sandbox-*")
# `sandbox` is the umbrella feature that activates the in-process sandbox
# abstraction layer.  On Linux it layers on top of `sandbox-landlock` when that
# crate is available; on other platforms it degrades to a permissive path-check
# (no OS-level enforcement) rather than panicking.
sandbox = []
sandbox-landlock = ["dep:landlock"]
sandbox-bubblewrap = []
# P4/M4.1 — Windows Job Object sandbox.  Activates the `windows` crate
# (already gated optional) plus the `Win32_System_JobObjects` and
# `Win32_System_Threading` API surfaces so the in-tree
# `JobObjectSandbox` can attach spawned shell children to a kernel-
# managed job and impose memory / CPU / process-count caps.  The
# feature is no-op on non-Windows targets (the windows crate itself
# fails to resolve there), and the corresponding source module
# degrades to a permissive shim on other platforms.
sandbox-windows-job = ["dep:windows"]
# Backward-compatible alias for older invocations
landlock = ["sandbox-landlock"]
# Prometheus metrics observer (requires 64-bit atomics; disable on 32-bit targets)
metrics = ["observability-prometheus"]
# probe = probe-rs for Nucleo memory read (adds ~50 deps; optional)
probe = ["dep:probe-rs"]
# rag-pdf = PDF ingestion for datasheet RAG
rag-pdf = ["dep:pdf-extract"]
# skill-creation = Autonomous skill creation from successful multi-step tasks
skill-creation = []
# Phase 6 M4 — filesystem-watcher adapter for the incremental
# SymbolGraph.  Enables the `notify` crate and the
# `code_intel::file_watcher_notify::NotifyWatcher` production
# implementation.  Off by default so `cargo check --no-default-features`
# remains a small leaf build.
fs-watch = ["dep:notify"]
# vector-index-sqlite = Enables sqlite-vec (vec0) virtual-table backend for O(log N)
# vector search. When disabled (default), the in-process `LinearIndex` is used.
vector-index-sqlite = []
# vector-index-hnsw = Enables HNSW ANN backend (Phase 2 C.7b placeholder;
# real hnsw_rs dependency activates in a follow-up sprint).
vector-index-hnsw = []
# whatsapp-web = Native WhatsApp Web client with custom rusqlite storage backend
whatsapp-web = ["dep:wa-rs", "dep:wa-rs-core", "dep:wa-rs-binary", "dep:wa-rs-proto", "dep:wa-rs-ureq-http", "dep:wa-rs-tokio-transport", "dep:serde-big-array", "dep:prost", "dep:qrcode"]
# voice-wake = Voice wake word detection via microphone (cpal)
voice-wake = ["dep:cpal"]
# WASM plugin system (extism-based)
plugins-wasm = ["dep:extism"]
# WASM sandbox runtime (wasmi-based in-process isolation)
runtime-wasm = ["dep:wasmi"]
# WebAuthn / FIDO2 hardware key authentication
webauthn = []
# Phase 4 §4.5 — CRDT Proof-of-Concept feature.  When enabled the
# `crate::coordination::crdt` module compiles and `OpsApplier` honors
# the `crdt_mode` flag.  The current implementation is an in-process
# stub mirroring the [`loro`] API surface (`apply_local` /
# `apply_remote` / `encode_update` / `current_text`); a real `loro`
# dependency can be folded in by adding `dep:loro` here once the
# crate is vendored / approved.  Off by default so the CI matrix
# does not pay the (future) compile cost.
crdt-coordination = []
# lsp-push-diagnostics = Enables server-to-client publishDiagnostics push
# subscription via DiagnosticsListener.  Off by default; the pull-based
# refresh_diagnostics API works without this feature.
lsp-push-diagnostics = []
# P3/M3.6 — SWE-bench-Lite Docker runner.  Activates the
# `evals::runners::swebench_docker` module (driven by `docker run`)
# and the corresponding `--suite swebench-docker` arm of the
# `evals_runner` binary.  Off by default because nightly CI is the
# primary consumer; local builds rarely have the upstream
# `sweb.eval.x86_64.*` images cached.
evals-swebench-docker = []
# Meta-feature for CI: all features except those requiring system C libraries
# not available on standard CI runners (e.g., voice-wake needs libasound2-dev).
ci-all = [
    "channel-nostr",
    "hardware",
    "channel-matrix",
    "channel-lark",
    "observability-prometheus",
    "observability-otel",
    "peripheral-rpi",
    "browser-native",
    "sandbox-landlock",
    "sandbox-bubblewrap",
    "probe",
    "rag-pdf",
    "skill-creation",
    "whatsapp-web",
    "plugins-wasm",
]
# Meta-feature: all messaging channel adapters in one switch
channels = [
    "channel-telegram",
    "channel-discord",
    "channel-slack",
    "channel-dingtalk",
    "channel-wechat",
    "channel-email",
    "channel-line",
    "channel-matrix",
    "channel-lark",
    "channel-nostr",
    "whatsapp-web",
]
# Meta-feature: language-specific code-intel grammar packs beyond the base set
code-intel-extra = ["code-intel-go", "code-intel-java", "code-intel-c", "code-intel-cpp"]
# Non-core tool feature groups (all included in default, opt-out for lean builds)
tool-cron = []
tool-sop = []
tool-team = []
tool-cloud-ops = []
tool-reports = []
tool-linkedin = []
tool-pushover = []
tool-search-social = []
tool-productivity = []
tool-utility-misc = []
tool-image = []
# Convenience meta-feature: all non-core tools
extras = ["tool-cron", "tool-sop", "tool-team", "tool-cloud-ops", "tool-reports", "tool-linkedin", "tool-pushover", "tool-search-social", "tool-productivity", "tool-utility-misc", "tool-image"]

[profile.dev]
incremental = true
# Keep `opt-level = 0` here: MSVC + incremental + `cdylib` linking (desktop's
# `sen_desktop_lib.dll`) has reproducibly surfaced thousands of `LNK2019`
# unresolved `anon.*.llvm*` symbols across CGUs when compiling dependencies at
# `opt-level ≥ 1` in dev mode. Thin/dev optimization is incompatible with this
# link graph until toolchain fixes land.
opt-level = 0

[profile.release]
opt-level = "z"      # Optimize for size
lto = "fat"          # Maximum cross-crate optimization for smaller binaries
codegen-units = 1    # Serialized codegen for low-memory devices (e.g., Raspberry Pi 3 with 1GB RAM)
                     # Higher values (e.g., 8) compile faster but require more RAM during compilation
strip = true          # Remove debug symbols
panic = "abort"      # Reduce binary size

[profile.release-fast]
inherits = "release"
codegen-units = 8    # Parallel codegen for faster builds on powerful machines (16GB+ RAM recommended)
                     # Use: cargo build --profile release-fast

[profile.ci]
inherits = "release"
lto = "thin"         # Much faster than fat LTO; still catches release-mode issues
codegen-units = 16   # Full parallelism for CI runners

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "tool_dispatch"
harness = false

[[bench]]
name = "blackboard_ops"
harness = false

[[bench]]
name = "parallel_tools"
harness = false

[[bench]]
name = "compression_pipeline"
harness = false

[[bench]]
name = "turn_streamed"
harness = false

[[bench]]
name = "editor_core_rope_bench"
harness = false

# Phase 3 D8 — HNSW insert/search micro-benchmarks.  See
# `benches/hnsw_bench.rs`.  Requires the HNSW backend feature.
[[bench]]
name = "hnsw_bench"
harness = false
required-features = ["vector-index-hnsw"]

# Phase 3 D8 — provider compatible-adapter request-building bench.  See
# `benches/provider_request.rs`.
[[bench]]
name = "provider_request"
harness = false

# Phase 0 / Task 0.1 — session submit microbenchmark.  Guards against
# regressions in the per-turn runtime overhead (see `benches/session_turn.rs`).
[[bench]]
name = "session_turn"
harness = false
