[workspace]
members = [
    ".",
    "desktop/src-tauri",
]
resolver = "2"

[lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
dead_code = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
print_stderr = "allow"
print_stdout = "allow"

[package]
name = "SenWeaverCoding"
version = "0.1.0"
edition = "2024"
authors = ["senweaver"]
license = "MIT"
description = "SenWeaverCoding - AI Code Editor built in Rust."
repository = "https://github.com/senweaver/SenWeaverCoding"
readme = "README.md"
keywords = ["ai", "code-editor", "cli", "coding", "framework"]
categories = ["command-line-utilities", "ai", "asynchronous"]
rust-version = "1.87"

include = [
  "/src/**/*",
  "/docs/**/*",
  "/build.rs",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
  "/tool_descriptions/**/*",
]

[[bin]]
name = "sen"
path = "src/main.rs"

[lib]
name = "senweavercoding"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false, features = ["fs", "sync"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "multipart", "stream", "socks", "gzip", "brotli", "deflate", "cookies"] }

encoding_rs = "0.8"

matrix-sdk = { version = "0.16", optional = true, default-features = false, features = ["e2e-encryption", "rustls-tls", "markdown", "sqlite"] }

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

directories = "6.0"
toml = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1"

schemars = "1.2"

tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

prometheus = { version = "0.14", default-features = false, optional = true }

base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }

urlencoding = "2.1"

nanohtml2text = "0.2"

dotenvy = "0.15"

fantoccini = { version = "0.22.1", optional = true, default-features = false, features = ["rustls-tls"] }

inventory = "0.3"

notify = { version = "8.2", optional = true }


tempfile = "3.26"

flate2 = "1.1"
tar = "0.4"

zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }

anyhow = "1.0"
thiserror = "2.0"

globset = "0.4"

uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

chacha20poly1305 = "0.10"

hmac = "0.12"
sha2 = "0.10"
similar = "2"
aho-corasick = "1.1"
memchr = "2.5"
hex = "0.4"

rand = "0.10"

portable-atomic = "1"

serde-big-array = { version = "0.5", optional = true }

parking_lot = "0.12"

dashmap = "5"

once_cell = "1"

async-trait = "0.1"

ring = "0.17"

prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }

rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
cron = "0.15"

dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"

glob = "0.3"

which = "8.0"

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }

crossbeam-deque = "0.8"
num_cpus = "1.16"
nostr-sdk = { version = "0.44", default-features = false, features = ["nip04", "nip59"], optional = true }
regex = "1.10"
hostname = "0.4.2"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1.14.0"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"

lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
mail-parser = "0.11.2"
async-imap = { version = "0.11",features = ["runtime-tokio"], default-features = false }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "cors"] }
http-body-util = "0.1"

opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots"], optional = true }

tokio-serial = { version = "5", default-features = false, optional = true }
ordered-float = "5.3.0"
arc-swap = "1.9.1"
zeroize = { version = "1.8.2", features = ["derive"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nusb = { version = "0.2", default-features = false, optional = true }

probe-rs = { version = "0.31", optional = true }

pdf-extract = { version = "0.10", optional = true }

extism = { version = "1.20", optional = true }
wasmi = { version = "0.42", optional = true }

ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }

syntect = { version = "5.0", optional = true }

ropey = "1.6"

tantivy = { version = "0.22", optional = true }

docx-rs = { version = "0.4", optional = true }

tree-sitter = { version = "0.24", optional = true }
tree-sitter-highlight = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.3", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
streaming-iterator = { version = "0.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"], optional = true }

cpal = { version = "0.15", optional = true }

qrcode = { version = "0.14", optional = true }

wa-rs = { version = "0.2", optional = true, default-features = false }
wa-rs-core = { version = "0.2", optional = true, default-features = false }
wa-rs-binary = { version = "0.2", optional = true, default-features = false }
wa-rs-proto = { version = "0.2", optional = true, default-features = false }
wa-rs-ureq-http = { version = "0.2", optional = true }
wa-rs-tokio-transport = { version = "0.2", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22", optional = true }
landlock = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

