[workspace]
members = [
    ".",
    "desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console"] }

[lints.rust]
unsafe_code = "allow"
unused_must_use = "warn"
dead_code = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
print_stderr = "allow"
print_stdout = "allow"

[package]
name = "SenWeaverCoding"
version = "0.1.0"
edition = "2024"
authors = ["senweaver"]
license = "MIT"
description = "SenWeaverCoding - AI Code Editor built in Rust."
repository = "https://github.com/senweaver/SenWeaverCoding"
readme = "README.md"
keywords = ["ai", "code-editor", "cli", "coding", "framework"]
categories = ["command-line-utilities", "ai", "asynchronous"]
rust-version = "1.87"

include = [
  "/src/**/*",
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE*",
  "/README.md",
]

[[bin]]
name = "sen"
path = "src/main.rs"

[lib]
name = "senweavercoding"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process", "io-std", "fs", "signal"] }
tokio-util = { version = "0.7", default-features = false }
tokio-stream = { version = "0.1.18", default-features = false, features = ["fs", "sync"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots", "blocking", "multipart", "stream", "socks", "gzip", "brotli", "deflate", "cookies"] }

encoding_rs = "0.8"

matrix-sdk = { version = "0.16", optional = true, default-features = false, features = ["e2e-encryption", "rustls-tls", "markdown", "sqlite"] }

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

directories = "6.0"
toml = "1.0"
serde_yaml = "0.9"
shellexpand = "3.1"

schemars = "1.2"

tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

prometheus = { version = "0.14", default-features = false, optional = true }

base64 = "0.22"
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }

enigo = { version = "0.6", optional = true }
xcap = { version = "0.9", optional = true }

urlencoding = "2.1"

nanohtml2text = "0.2"

dotenvy = "0.15"

fantoccini = { version = "0.22.1", optional = true, default-features = false, features = ["rustls-tls"] }

inventory = "0.3"

notify = { version = "8.2", optional = true }


tempfile = "3.26"

flate2 = "1.1"
tar = "0.4"

zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }

anyhow = "1.0"
thiserror = "2.0"

globset = "0.4"

uuid = { version = "1.22", default-features = false, features = ["v4", "std"] }

chacha20poly1305 = "0.10"
argon2 = "0.5"

hmac = "0.12"
sha2 = "0.10"
similar = "2"
aho-corasick = "1.1"
memchr = "2.5"
hex = "0.4"

rand = "0.10"

portable-atomic = "1"

serde-big-array = { version = "0.5", optional = true }

parking_lot = "0.12"

dashmap = "5"

once_cell = "1"

async-trait = "0.1"

ring = "0.17"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }

prost = { version = "0.14", default-features = false, features = ["derive"], optional = true }

rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
cron = "0.15"

dialoguer = { version = "0.12", features = ["fuzzy-select"] }
console = "0.16"

glob = "0.3"

which = "8.0"

tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink", "alloc"] }

crossbeam-deque = "0.8"
num_cpus = "1.16"
nostr-sdk = { version = "0.44", default-features = false, features = ["nip04", "nip59"], optional = true }
regex = "1.10"
hostname = "0.4.2"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1.14.0"
rustls-native-certs = "0.8"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.6"

lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
mail-parser = "0.11.2"
async-imap = { version = "0.11",features = ["runtime-tokio"], default-features = false }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["limit", "timeout", "cors"] }
http-body-util = "0.1"

opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots"], optional = true }

tokio-serial = { version = "5", default-features = false, optional = true }
ordered-float = "5.3.0"
arc-swap = "1.9.1"
zeroize = { version = "1.8.2", features = ["derive"] }
serde_ignored = "0.1.14"

mdns-sd = { version = "0.13", optional = true }
mac_address = { version = "1.1", optional = true }
local-ip-address = { version = "0.6", optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"], optional = true }
calamine = { version = "0.35.0", optional = true }
quick-xml = { version = "0.40.1", optional = true }
rust_xlsxwriter = { version = "0.95", optional = true }
lopdf = { version = "0.41", optional = true }
printpdf = { version = "0.9", default-features = false, optional = true }
ttf-parser = { version = "0.25", optional = true }
subsetter = { version = "0.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nusb = { version = "0.2", default-features = false, optional = true }

probe-rs = { version = "0.31", optional = true }

pdf-extract = { version = "0.10", optional = true }

extism = { version = "1.20", optional = true }
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = { version = "0.28", optional = true }

syntect = { version = "5.0", optional = true }

ropey = "1.6"
unicode-width = "0.2"

docx-rs = { version = "0.4", optional = true }

tree-sitter = { version = "0.24", optional = true }
tree-sitter-highlight = { version = "0.24", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-toml-ng = { version = "0.7", optional = true }
tree-sitter-md = { version = "0.3", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
streaming-iterator = { version = "0.1", optional = true }

cpal = { version = "0.15", optional = true }

rumqttc = { version = "0.24", optional = true }

qrcode = { version = "0.14", optional = true }

wa-rs = { version = "0.2", optional = true, default-features = false, features = ["tokio-transport", "ureq-client", "tokio-native"] }
wa-rs-core = { version = "0.2", optional = true, default-features = false }
wa-rs-binary = { version = "0.2", optional = true, default-features = false }
wa-rs-proto = { version = "0.2", optional = true, default-features = false }
wa-rs-ureq-http = { version = "0.2", optional = true }
wa-rs-tokio-transport = { version = "0.2", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"], optional = true }
windows-sys = { workspace = true }
winreg = "0.55"

[target.'cfg(target_os = "linux")'.dependencies]
rppal = { version = "0.22", optional = true }
landlock = { version = "0.4", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = [
    "observability-prometheus",
    "skill-creation",
    "fs-watch",
    "sandbox",
    "sandbox-windows-job",
    "lsp-push-diagnostics",
    "tool-image",
    "tool-utility-misc",
    "tool-search-broad",
    "tool-workspace-deep",
    "tool-curator",
    "lan-comms",
    "office-docs",
    "code-intel",
]
lan-comms = ["dep:mdns-sd", "dep:mac_address", "dep:local-ip-address", "dep:x25519-dalek"]
tui = ["dep:ratatui", "dep:crossterm", "dep:syntect"]
code-intel = [
    "dep:tree-sitter",
    "dep:tree-sitter-highlight",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-md",
    "dep:streaming-iterator",
    "code-intel-go",
    "code-intel-java",
    "code-intel-c",
    "code-intel-cpp",
]
code-intel-go = ["dep:tree-sitter-go"]
code-intel-java = ["dep:tree-sitter-java"]
code-intel-c = ["dep:tree-sitter-c"]
code-intel-cpp = ["dep:tree-sitter-cpp"]
channel-nostr = ["dep:nostr-sdk"]
hardware = ["nusb", "tokio-serial"]
channel-matrix = ["dep:matrix-sdk"]
channel-lark = ["dep:prost"]
channel-feishu = ["channel-lark"]
channel-telegram = []
channel-slack = []
channel-discord = []
channel-dingtalk = []
channel-wechat = []
channel-email = []
channel-line = []
channel-twilio = []
observability-prometheus = ["dep:prometheus"]
observability-otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]
peripheral-rpi = ["rppal"]
browser-native = ["dep:fantoccini"]
fantoccini = ["browser-native"]
sandbox = []
sandbox-landlock = ["dep:landlock"]
sandbox-bubblewrap = []
sandbox-windows-job = ["dep:windows"]
landlock = ["sandbox-landlock"]
metrics = ["observability-prometheus"]
probe = ["dep:probe-rs"]
rag-pdf = ["dep:pdf-extract"]
skill-creation = []
fs-watch = ["dep:notify"]
whatsapp-web = ["dep:wa-rs", "dep:wa-rs-core", "dep:wa-rs-binary", "dep:wa-rs-proto", "dep:wa-rs-ureq-http", "dep:wa-rs-tokio-transport", "dep:serde-big-array", "dep:prost", "dep:qrcode"]
voice-wake = ["dep:cpal"]
plugins-wasm = ["dep:extism"]
runtime-wasm = []
webauthn = []
# Experimental, opt-in only (intentionally NOT in `default`). Coordinates sessions
# and workers WITHIN one process via the in-process blackboard: best-effort
# last-writer-wins convergence plus a re-read-and-retry conflict guard, NOT full
# operational-transform conflict resolution and NOT cross-process/cross-device sync
# (cross-process write safety comes from OS advisory file locks in the workspace
# resource manager); see the runtime warning it emits.
crdt-coordination = []
computer-use = ["dep:enigo", "dep:xcap", "dep:windows"]
lsp-push-diagnostics = []
evals-swebench-docker = []
ci-all = [
    "channel-nostr",
    "hardware",
    "channel-matrix",
    "channel-lark",
    "observability-prometheus",
    "observability-otel",
    "peripheral-rpi",
    "browser-native",
    "sandbox-landlock",
    "sandbox-bubblewrap",
    "probe",
    "rag-pdf",
    "office-docs",
    "skill-creation",
    "whatsapp-web",
    "plugins-wasm",
]
channels = [
    "channel-matrix",
    "channel-lark",
    "channel-nostr",
    "channel-telegram",
    "channel-slack",
    "channel-discord",
    "channel-dingtalk",
    "channel-wechat",
    "channel-email",
    "channel-line",
    "channel-twilio",
    "whatsapp-web",
]
channels-lite = [
    "channel-lark",
    "channel-nostr",
    "channel-telegram",
    "channel-slack",
    "channel-discord",
    "channel-dingtalk",
    "channel-wechat",
    "channel-email",
    "channel-line",
    "channel-twilio",
    "whatsapp-web",
]
code-intel-extra = ["code-intel-go", "code-intel-java", "code-intel-c", "code-intel-cpp"]
tool-cron = []
tool-sop = []
sop-mqtt = ["dep:rumqttc", "tool-sop"]
tool-team = []
tool-cloud-ops = []
tool-reports = []
tool-linkedin = []
tool-pushover = []
tool-search-social = []
tool-productivity = []
tool-utility-misc = []
tool-image = []
tool-search-broad = []
tool-workspace-deep = []
tool-curator = ["dep:docx-rs"]
office-docs = ["dep:calamine", "dep:quick-xml", "dep:rust_xlsxwriter", "dep:lopdf", "dep:printpdf", "dep:ttf-parser", "dep:subsetter", "rag-pdf"]
extras = ["tool-cron", "tool-sop", "sop-mqtt", "tool-team", "tool-cloud-ops", "tool-reports", "tool-linkedin", "tool-pushover", "tool-search-social", "tool-productivity", "tool-utility-misc", "tool-image", "tool-search-broad", "tool-workspace-deep", "tool-curator", "office-docs", "computer-use"]

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.release-fast]
inherits = "release"
codegen-units = 8

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "scheduler"
harness = false

[[bench]]
name = "vector_search"
harness = false

[[bench]]
name = "tool_dispatch"
harness = false

[[bench]]
name = "blackboard_ops"
harness = false

[[bench]]
name = "turn_streamed"
harness = false

[[bench]]
name = "editor_core_rope_bench"
harness = false

[[bench]]
name = "hnsw_bench"
harness = false

[[bench]]
name = "provider_request"
harness = false

[[bench]]
name = "session_turn"
harness = false
